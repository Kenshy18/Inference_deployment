[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mask-postprocess"
version = "1.0.0"
description = "Standalone, contract-driven instance-segmentation post-processing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "scipy",
  "torch",
  "orjson",
]

[project.optional-dependencies]
dev = ["black>=24", "pytest>=8"]

[project.scripts]
postprocess = "run_pipeline:main"
postprocess-export-legacy-sqlite = "artifacts.export_legacy_cli:main"
postprocess-precompute-cuts = "precompute_cuts:main"
postprocess-package-result = "package_result:main"

[tool.hatch.build.targets.wheel]
packages = [
  "common",
  "contracts",
  "preprocessing",
  "nms",
  "cut_detection",
  "tracking",
  "evaluation",
  "face_privacy",
  "artifacts",
  "visualization",
  "classwise",
  "production",
]

exclude = [
  "nms/adaptive.py",
  "nms/component_aware.py",
  "nms/stages.py",
]

[tool.hatch.build.targets.wheel.force-include]
"run_pipeline.py" = "run_pipeline.py"
"precompute_cuts.py" = "precompute_cuts.py"
"package_result.py" = "package_result.py"
"models" = "models"
"CONTRACT.md" = "mask_postprocess_docs/CONTRACT.md"
"README.md" = "mask_postprocess_docs/README.md"
"configs" = "mask_postprocess_docs/configs"
"docs" = "mask_postprocess_docs/docs"
"vendor" = "vendor"

[tool.black]
line-length = 88
target-version = ["py310"]
