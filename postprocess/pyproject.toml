[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mask-postprocess"
version = "1.0.0"
description = "Standalone, contract-driven instance-segmentation post-processing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "torch",
  "orjson",
]

[project.optional-dependencies]
dev = ["black>=24", "pytest>=8"]

[project.scripts]
postprocess = "run_pipeline:main"
postprocess-export-legacy-sqlite = "tentative.export_legacy_sqlite:main"

[tool.hatch.build.targets.wheel]
packages = [
  "common",
  "contracts",
  "preprocessing",
  "nms",
  "cut_detection",
  "tracking",
  "approximation",
  "keyframes",
  "gap_fill",
  "evaluation",
  "artifacts",
  "visualization",
  "tentative",
]

[tool.hatch.build.targets.wheel.force-include]
"run_pipeline.py" = "run_pipeline.py"
"models" = "models"
"CONTRACT.md" = "mask_postprocess_docs/CONTRACT.md"
"README.md" = "mask_postprocess_docs/README.md"
"configs" = "mask_postprocess_docs/configs"
"docs" = "mask_postprocess_docs/docs"

[tool.black]
line-length = 88
target-version = ["py310"]
